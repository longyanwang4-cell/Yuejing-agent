# 放到 /etc/nginx/sites-available/yuejing，再链接到 sites-enabled/，并删掉 sites-enabled/default（见 DEPLOY.md）
# 本文件没有用 `nginx -t` 验证过（写它的机器上没有 nginx）。在服务器上先跑 `sudo nginx -t` 再 reload。

server {
    listen 80 default_server;
    server_name _;

    # 用户输入最多 300 字，请求体不会大；限小一点，挡掉乱灌的请求
    client_max_body_size 64k;

    # 前端 JS 约 780 KB，压缩后约 220 KB。服务器带宽通常很小，这一项对首次打开速度影响最大。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # 来源 IP：用「覆盖」而不是「追加」($proxy_add_x_forwarded_for)。
    # 覆盖之后，传给后端的 X-Forwarded-For 里只有 nginx 亲眼看到的连接地址一项，客户端自己塞的头被丢掉，没法伪造。
    # 后端取这个头最右一项（backend/app/main.py 的 client_ip）；头里只有一项时，最左最右是同一个。
    # 注意：这只在「nginx 是唯一一层代理」时成立。如果前面还有华为云的负载均衡（ELB）或 CDN，
    # $remote_addr 会变成它们的地址，所有人又会被当成同一个 IP——那时要改用 ELB 传来的真实 IP 头，别照搬这里。
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # 后端单次模型调用最多重试一次再降级，前端等待上限 75 秒，这里留余量
    proxy_read_timeout 100s;

    location / {
        proxy_pass http://127.0.0.1:8765;
    }

    # 静态资源缓存一天，回访时不用再下载那几 MB 的 UI 图
    # （js/css 文件名带哈希，png 没有，所以不要设太长，换了图最多一天后生效）
    location ~* \.(png|js|css)$ {
        proxy_pass http://127.0.0.1:8765;
        expires 1d;
        add_header Cache-Control "public";
    }
}
